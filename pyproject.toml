[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filefinder"
version = "0.1.0"
description = "Everything-style instant file search for Windows (NTFS MFT + USN journal)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
filefinder = "filefinder.cli:main"

[project.gui-scripts]
filefinder-gui = "filefinder.cli:main"

[tool.setuptools]
packages = ["filefinder"]

[tool.setuptools.package-data]
filefinder = ["locales/*.json"]
